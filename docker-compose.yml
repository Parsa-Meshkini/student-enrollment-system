services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: "enrollment_user"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - student-enrollment-network

  web:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DJANGO_SECRET_KEY: "${SECRET_KEY}"
      DJANGO_DEBUG: "${DEBUG}"
      DB_NAME: "enrollment_db"
      DB_USER: "enrollment_user"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0"
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - student-enrollment-network

  frontend:
    build: ./enrollment-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./enrollment-frontend:/app
      - /app/node_modules
    depends_on:
      - web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - student-enrollment-network

volumes:
  pgdata:

networks:
  student-enrollment-network:
    driver: bridge
